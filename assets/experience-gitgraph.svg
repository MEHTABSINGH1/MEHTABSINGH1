<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Career as a git graph"><title>Career as a git graph</title><style>
.sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace}

    .h{font:700 22px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#e2e8f0} .hash{font:600 12px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#fbbf24}
    .c1{font:700 15px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#e2e8f0} .c2{font:500 13px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8b95b0}
    .tagt{font:700 12px 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;fill:#060914}
    </style><defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060914"/><stop offset="1" stop-color="#0d1326"/></linearGradient>
    <pattern id="ggrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a3354" stroke-width="0.6" opacity="0.55"/></pattern>
    <linearGradient id="gscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.10"/></linearGradient>
    <linearGradient id="gedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/></linearGradient>
    <clipPath id="gclip"><rect width="1200" height="470" rx="22"/></clipPath>
    <filter id="gglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g clip-path="url(#gclip)">
    <rect width="1200" height="470" fill="url(#gbg)"/>
    <rect width="1200" height="470" fill="url(#ggrid)"/>
    <rect x="0" y="-120" width="1200" height="120" fill="url(#gscan)">
      <animate attributeName="y" values="-120;470" dur="6s" repeatCount="indefinite"/></rect>
    <text x="40" y="52" class="h"><tspan fill="#8b95b0">$</tspan> git log <tspan fill="#22d3ee">--graph</tspan> <tspan fill="#f472b6">--oneline</tspan> career</text>
    <path d="M60,250 L1140,250" stroke="#2a3354" stroke-width="4" fill="none"/>
    <path d="M60,250 L1140,250" stroke="#22d3ee" stroke-width="4" fill="none" stroke-dasharray="1100" stroke-dashoffset="1100" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="1100;0;0" keyTimes="0;0.5;1" dur="12s" repeatCount="indefinite"/></path>
    <path d="M560,250 C600,250 600,350 650,350 L900,350 C950,350 950,250 990,250" stroke="#2a3354" stroke-width="4" fill="none"/>
