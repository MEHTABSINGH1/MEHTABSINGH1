      <animate attributeName="stroke-dashoffset" values="600;600;0;0" keyTimes="0;0.24;0.46;1" dur="12s" repeatCount="indefinite"/></path>
    <circle r="7" fill="#fff" filter="url(#gglow)"><animateMotion dur="6.0s" repeatCount="indefinite" path="M60,250 L1140,250"/></circle>
    <circle r="5" fill="#a78bfa" filter="url(#gglow)"><animateMotion dur="6.0s" begin="1.5s" repeatCount="indefinite" path="M560,250 C600,250 600,350 650,350 L900,350 C950,350 950,250 990,250"/></circle>
    
